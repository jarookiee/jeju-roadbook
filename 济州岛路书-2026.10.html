const tabs=document.getElementById('tabs'), main=document.getElementById('main');
const enc=encodeURIComponent;
const q=a=>a.kr?`${a.name||''} ${a.kr} ${a.addr||''}`.trim():'';

function mapLinks(a){
  const query=enc(q(a));
  return `<div class="acts">
    <a class="n" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${query}">🗺️ Naver 导航</a>
    <a class="g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${query}">Google</a>
    <a class="k" target="_blank" rel="noopener" href="https://map.kakao.com/link/search/${query}">Kakao</a>
    ${a.tel?`<a href="tel:${a.tel.replace(/[^0-9+]/g,'')}">📞 ${a.tel}</a>`:''}
  </div>`;
}

/* tabs */
DAYS.forEach((d,i)=>{
  const b=document.createElement('button');
  b.innerHTML=`${d.date}<small>${d.wk} · ${d.tag}</small>`;
  b.onclick=()=>show(d.id);
  b.dataset.id=d.id;
  tabs.appendChild(b);
});

function show(id){
  document.querySelectorAll('section.day').forEach(s=>s.classList.toggle('on',s.dataset.id===id));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  localStorage.setItem('jejuDay',id);
  window.scrollTo({top:document.querySelector('nav.tabs').offsetTop-4,behavior:'instant'});
  setProg();
}

function renderDay(d){
  const s=document.createElement('section');
  s.className='day'+(d.todo?' todo':''); s.dataset.id=d.id;
  let h=`<h2 class="title">${d.title}<span class="tag">${d.date} ${d.wk}</span></h2>`;
  if(d.note) h+=`<div class="card note"><div class="row"><div class="ic">📌</div><div class="body"><div class="desc">${d.note}</div></div></div></div>`;
  d.items.forEach((it,idx)=>{
    const cls=it.warn?'warn':(it.list?'food':(it.d&&/车|打车|公交|导航|移动/.test(it.h)?'move':''));
    h+=`<div class="card ${cls}">
      <div class="row">
        <div class="tm"><b>${it.t}</b></div>
        <div class="ic">${it.ic}</div>
        <div class="body">
          <h3>${it.h}</h3>
          ${it.kr?`<div class="kr">${it.kr}</div>`:''}
          ${it.d?`<ul class="desc">${it.d.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
          ${it.list?`<ul class="desc">${it.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
          ${it.price?`<div class="meta"><span class="chip r">💰 ${it.price}</span></div>`:''}
          ${mapLinks(it)}
          <div class="acts" style="margin-top:6px">
            <button class="ck-btn" data-d="${d.id}" data-i="${idx}">打卡</button>
          </div>
        </div>
      </div>
    </div>`;
  });
  s.innerHTML=h;
  main.appendChild(s);
}
DAYS.forEach(renderDay);

/* ---------- 打卡（localStorage） ---------- */
const ckKey='jejuCk';
function loadCk(){try{return JSON.parse(localStorage.getItem(ckKey))||{}}catch(e){return{}}}
function saveCk(o){localStorage.setItem(ckKey,JSON.stringify(o))}
function paintCk(){
  const st=loadCk();
  document.querySelectorAll('.ck-btn').forEach(b=>{
    const on=!!st[b.dataset.d+'|'+b.dataset.i];
    b.classList.toggle('done',on);
    b.textContent=on?'已打卡':'打卡';
  });
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.ck-btn'); if(!b) return;
  const k=b.dataset.d+'|'+b.dataset.i, st=loadCk();
  st[k]=!st[k]; saveCk(st); paintCk(); setProg();
});

/* 清单勾选持久化 */
const LS='jejuPack';
function pack(){try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]}}
document.querySelectorAll('.acc .ck input').forEach(i=>{
  if(pack().includes(i.id)) i.checked=true;
  i.addEventListener('change',()=>{const a=pack();const j=a.indexOf(i.id);
    i.checked? (j<0&&a.push(i.id)) : (j>=0&&a.splice(j,1)); savePack(a);});
});
function savePack(a){localStorage.setItem(LS,JSON.stringify(a));}

    box.innerHTML=`<div><b>${d}</b><span>天后出发</span></div>
      <div><b>${META.startISO.slice(5,10).replace('-','.')}</b><span>起飞日</span></div>
      <div><b>4</b><span>晚住宿</span></div>
      <div><b>2</b><span>人同行</span></div>`;
  } else {
    const on=DAYS.find(x=>x.date===now.toISOString().slice(5,10).replace('-','-'));
    box.innerHTML=`<div><b>🏝</b><span>${on?on.date+' '+on.wk:'济州岛旅行中'}</span></div>
      <div><b>${META.sunset.slice(0,2)}</b><span>日落时间</span></div>
      <div><b>18:15</b><span>咖啡街</span></div>`;
  }
  // 自动切到今天
  const t=now.toISOString().slice(5,10);
  if(DAYS.some(x=>x.date===t) && !sessionStorage.getItem('jejuAuto')){
    sessionStorage.setItem('jejuAuto','1'); show('d'+DAYS.findIndex(x=>x.date===t));
  }
}
tick(); setInterval(tick,60000);

/* 天气卡 */
document.getElementById('wx').textContent =
  `☀️ 10 月初济州：白天 20–24°C / 早晚 16–18°C · ${META.sunset} · 住宿：${META.hotel.kr}`;

/* ---------- 进度条 ---------- */
function setProg(){
  const all=document.querySelectorAll('.ck-btn').length, done=document.querySelectorAll('.ck-btn.done').length;
  document.getElementById('prog').style.width=(all?done/all*100:0)+'%';
}

/* 备注 */
const nt=document.getElementById('notes');
nt.value=localStorage.getItem('jejuNotes')||'';
nt.addEventListener('input',()=>localStorage.setItem('jejuNotes',nt.value));

/* 初始 tab */
show(localStorage.getItem('jejuDay')||'d1');
paintCk(); setProg();
</script>
</body>
</html>
